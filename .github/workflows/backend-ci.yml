name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore Portfolio.sln

      - name: Build
        run: dotnet build Portfolio.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Portfolio.sln --configuration Release --no-build
        env:
          DOCKER_API_VERSION: "1.43"

      - name: Verify formatting
        run: dotnet format Portfolio.sln --verify-no-changes --no-restore

      - name: Build immutable container image
        run: docker build --tag portfolio-api:${{ github.sha }} .

      - name: Smoke-test container
        shell: pwsh
        run: ./scripts/Test-Container.ps1 -Image portfolio-api:${{ github.sha }}

      - name: Export verified container image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output portfolio-api.tar portfolio-api:${{ github.sha }}

      - name: Upload verified container image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-api-${{ github.sha }}
          path: portfolio-api.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified container image
        uses: actions/download-artifact@v8
        with:
          name: portfolio-api-${{ github.sha }}

      - name: Load verified container image
        run: docker load --input portfolio-api.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable container image
        run: |
          docker tag portfolio-api:${{ github.sha }} ghcr.io/hoangnam-dev/cg03-aboutme-api:${{ github.sha }}
          docker push ghcr.io/hoangnam-dev/cg03-aboutme-api:${{ github.sha }}

      - name: Record published digest
        run: docker image inspect ghcr.io/hoangnam-dev/cg03-aboutme-api:${{ github.sha }} --format '{{json .RepoDigests}}'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    concurrency:
      group: cg03aboutme-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ vars.PRODUCTION_SSH_USER }}
    steps:
      - name: Check out deployment contracts
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block automatic deployment when migrations changed
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Cannot verify the previous main commit; deploy manually using docs/operations/DEPLOYMENT.md."
            exit 1
          fi
          if ! git diff --quiet "$BEFORE_SHA" "$RELEASE_SHA" -- src/Portfolio.Infrastructure/Persistence/Migrations/; then
            echo "::error::EF Core migrations changed. Follow docs/operations/MIGRATIONS.md and deploy manually after the controlled migration."
            exit 1
          fi

      - name: Configure pinned production SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_PORT"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy published SHA image
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "deploy ${{ github.sha }}"
